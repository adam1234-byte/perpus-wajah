{% extends "base.html" %}{% block c %}
<div class="c"><h2>Login dengan Wajah</h2>
<div class="cam"><video id="v" muted playsinline></video><canvas id="c"></canvas></div>
<p id="st" class="st"></p><p id="msg"></p>
<p>Hadapkan wajah ke kamera, login berjalan otomatis.</p></div>
<div class="c"><h2>Login Email</h2><form method="post"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button> <a href="/register">Registrasi</a></form></div>
{% endblock %}{% block s %}<script>
const v=document.getElementById('v'),c=document.getElementById('c'),st=document.getElementById('st'),msg=document.getElementById('msg');
let busy=false;
initCam(v,c,st,async()=>{
  if(busy)return;
  busy=true;
  try{
    const d=await desc(v,1);
    if(d){
      const r=await post('/login/face',d);
      if(r.ok){msg.textContent='Login berhasil...';location='/';return;}
      msg.textContent=r.msg;
    }
  }catch(e){}
  setTimeout(()=>{busy=false},2000);
}).catch(e=>{st.textContent=camError(e);st.className='st bad';});
</script>{% endblock %}
