{% extends "base.html" %}{% block c %}
<div class="c"><h2>Scan Wajah Peminjam</h2>
<div class="cam"><video id="v" muted playsinline></video><canvas id="c"></canvas></div>
<p id="st" class="st"></p><p id="msg">Hadapkan wajah member ke kamera, pengenalan berjalan otomatis.</p>
<button type="button" id="rs">Scan Ulang</button>
<form method="post" style="margin-top:12px"><input type="hidden" name="user_id" id="uid"><p>Member: <b id="mn">-</b></p>
<select name="book_id">{% for b in books %}<option value="{{b.id}}">{{b.title}}</option>{% endfor %}</select><button id="go" disabled>Proses Peminjaman</button></form></div>
{% endblock %}{% block s %}<script>
const v=document.getElementById('v'),c=document.getElementById('c'),st=document.getElementById('st'),msg=document.getElementById('msg');
const uid=document.getElementById('uid'),mn=document.getElementById('mn'),go=document.getElementById('go');
let busy=false,found=false;
initCam(v,c,st,async()=>{
  if(busy||found)return;
  busy=true;
  try{
    const d=await desc(v,1);
    if(d){
      const r=await post('/admin/scan',d);
      mn.textContent=r.name;
      if(r.ok){uid.value=r.id;go.disabled=false;found=true;msg.textContent='Member dikenali. Pilih buku lalu proses.';return;}
    }
  }catch(e){}
  setTimeout(()=>{busy=false},2000);
}).catch(e=>{st.textContent=camError(e);st.className='st bad';});
document.getElementById('rs').onclick=()=>{
  found=false;busy=false;uid.value='';mn.textContent='-';go.disabled=true;
  msg.textContent='Hadapkan wajah member ke kamera, pengenalan berjalan otomatis.';
};
</script>{% endblock %}
